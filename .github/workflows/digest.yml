name: digest

on:
  schedule:
    - cron: "0 6 * * *"   # ~08h Europe/Paris
  workflow_dispatch:

concurrency:
  group: veille-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Envoi du digest quotidien
        run: python main.py digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Commit état
        run: |
          git config user.name "veille-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/veille.db
          git diff --cached --quiet || git commit -m "chore: digest $(date -u +%FT%TZ) [skip ci]"
          git push

